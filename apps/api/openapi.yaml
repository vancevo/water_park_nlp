openapi: 3.0.3
info:
  title: Dam Sen Smart Guide API
  version: 0.1.1
  description: >-
    0.1.1 = narration/TTS contract v1.1 (additive over v1, ADR 0014): TTS error
    responses documented, job artifact summary, latest job per narration,
    admin audio preview and AI provenance on narration audio.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /v1/auth/register:
    post:
      operationId: register
      summary: Create a visitor account and refresh session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/refresh:
    post:
      operationId: refresh
      description: Rotates the supplied refresh token; the previous token is revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/logout:
    post:
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Active refresh session revoked }
  /v1/admin/pois:
    get:
      operationId: listAdminPois
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All POIs including unpublished records
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/AdminPoi' },
                }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAdminPoi
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPoiInput' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPoi' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/pois/{id}:
    patch:
      operationId: updateAdminPoi
      security: [{ bearerAuth: [] }]
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPoiInput' }
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPoi' }
    delete:
      operationId: deleteAdminPoi
      security: [{ bearerAuth: [] }]
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        '204': { description: Draft or rejected POI deleted }
  /v1/admin/pois/{id}/submit:
    post:
      operationId: submitAdminPoi
      security: [{ bearerAuth: [] }]
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        '200':
          description: Content version pending review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPoi' }
  /v1/admin/content/{versionId}/approve:
    post:
      operationId: approveContent
      security: [{ bearerAuth: [] }]
      parameters:
        [
          {
            name: versionId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        '200':
          description: Version published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPoi' }
  /v1/admin/content/{versionId}/reject:
    post:
      operationId: rejectContent
      security: [{ bearerAuth: [] }]
      parameters:
        [
          {
            name: versionId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowReasonRequest' }
      responses:
        '200':
          description: Version rejected with reason
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPoi' }
  /v1/admin/audit-logs:
    get:
      operationId: listAuditLogs
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: POI mutation audit trail; ADMIN only
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/AuditLogEntry' },
                }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/pois:
    get:
      operationId: listPois
      summary: List published POIs
      parameters:
        - {
            name: lat,
            in: query,
            schema: { type: number, minimum: -90, maximum: 90 },
          }
        - {
            name: lng,
            in: query,
            schema: { type: number, minimum: -180, maximum: 180 },
          }
        - {
            name: radius,
            in: query,
            schema: { type: number, minimum: 1, maximum: 5000 },
          }
        - {
            name: category,
            in: query,
            schema: { type: string, pattern: '^[a-z][a-z0-9_-]{0,49}$' },
          }
        - { name: openNow, in: query, schema: { type: boolean } }
        - {
            name: locale,
            in: query,
            schema: { $ref: '#/components/schemas/SupportedLocale' },
          }
      responses:
        '200':
          description: Published POIs, ordered by distance when coordinates are present
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoiListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/search:
    get:
      operationId: search
      summary: Lexically search published POIs with optional spatial filters
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: locale
          in: query
          schema: { $ref: '#/components/schemas/SupportedLocale' }
        - {
            name: category,
            in: query,
            schema: { type: string, pattern: '^[a-z][a-z0-9_-]{0,49}$' },
          }
        - { name: openNow, in: query, schema: { type: boolean } }
        - {
            name: lat,
            in: query,
            schema: { type: number, minimum: -90, maximum: 90 },
          }
        - {
            name: lng,
            in: query,
            schema: { type: number, minimum: -180, maximum: 180 },
          }
        - {
            name: radius,
            in: query,
            schema: { type: number, minimum: 1, maximum: 5000 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, maximum: 10000, default: 0 },
          }
      responses:
        '200':
          description: Ranked published POIs with a stable POI-ID tie-break
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/pois/{id}:
    get:
      operationId: getPoi
      summary: Get one published POI
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: locale
          in: query
          schema: { $ref: '#/components/schemas/SupportedLocale' }
      responses:
        '200':
          description: Published POI detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoiDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: POI does not exist or is not published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
  /v1/pois/{poiId}/narration:
    get:
      operationId: getPoiNarration
      summary: Get the exact-locale published narration for a published POI
      parameters:
        - name: poiId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: locale
          in: query
          schema: { $ref: '#/components/schemas/NarrationLocaleCode' }
      responses:
        '200':
          description: Published transcript and optional reviewed audio metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoiNarration' }
        '404':
          description: POI or exact-locale published narration was not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
  /v1/admin/pois/{poiId}/narrations:
    get:
      operationId: listAdminNarrations
      security: [{ bearerAuth: [] }]
      parameters:
        - name: poiId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: All narration revisions, including unpublished revisions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminNarration' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAdminNarration
      security: [{ bearerAuth: [] }]
      parameters:
        - name: poiId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NarrationInput' }
      responses:
        '201':
          description: Draft narration revision created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNarration' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/media/presign:
    post:
      operationId: createAudioUploadIntent
      summary: Create a five-minute signed PUT for one immutable audio object
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaUploadIntentRequest' }
      responses:
        '201':
          description: Policy-bound upload intent; all required headers must be sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUploadIntent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: Object storage is disabled or unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
  /v1/admin/narrations/{id}:
    patch:
      operationId: updateAdminNarration
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NarrationUpdate' }
      responses:
        '200':
          description: Draft or rejected narration updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNarration' }
        '409':
          description: >-
            Not editable, or TTS_JOB_IN_PROGRESS while a TTS job of this
            narration is queued/running (v1.1)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    delete:
      operationId: deleteAdminNarration
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Draft or rejected narration deleted }
  /v1/admin/narrations/{id}/submit:
    post:
      operationId: submitAdminNarration
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Narration submitted for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNarration' }
        '409':
          description: >-
            Not editable, or TTS_JOB_IN_PROGRESS while a TTS job of this
            narration is queued/running (v1.1)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
  /v1/admin/narrations/{id}/approve:
    post:
      operationId: approveAdminNarration
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Pending narration published; previous revision superseded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNarration' }
  /v1/admin/narrations/{id}/reject:
    post:
      operationId: rejectAdminNarration
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowReasonRequest' }
      responses:
        '200':
          description: Pending narration rejected with a reason
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNarration' }
  /v1/narration-locales:
    get:
      operationId: getNarrationLocales
      summary: Enabled narration locales in configured order
      responses:
        '200':
          description: Locale catalog (enabled locales only, configured order)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NarrationLocaleCatalog' }
  /v1/admin/narrations/{narrationId}/tts-jobs:
    post:
      operationId: createTtsJob
      summary: Queue a TTS generation job for a draft narration
      description: >-
        Roles EDITOR/ADMIN. Idempotent by narration + transcript + model version:
        a queued/running/succeeded job is returned as-is, a failed/cancelled one
        is re-queued in place (same id). The worker attaches the generated audio
        to the DRAFT narration only (never publishes).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: narrationId
          in: path
          required: true
          description: Any UUID version (seeded narrations are not v4)
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTtsJobRequest' }
      responses:
        '202':
          description: Job accepted and queued (or the existing idempotent job)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TtsGenerationJob' }
        '400':
          description: >-
            Invalid request. code is one of NARRATION_LOCALE_DISABLED,
            TTS_JOB_LOCALE_MISMATCH, TTS_JOB_TRANSCRIPT_EMPTY,
            TTS_VOICE_UNAVAILABLE (no enabled worker voice for the
            locale/provider/model) or BAD_REQUEST (body/uuid validation).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            NARRATION_NOT_DRAFT (only a draft narration can get AI audio) or
            TTS_JOB_IN_PROGRESS (another job of this narration is queued/running).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
        '429': { $ref: '#/components/responses/TtsQuotaExceeded' }
        '503':
          description: AI_FEATURE_DISABLED — the TTS kill switch is off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
  /v1/admin/narrations/{narrationId}/tts-jobs/latest:
    get:
      operationId: getLatestTtsJob
      summary: Most recent TTS job of a narration (contract v1.1)
      description: Roles EDITOR/REVIEWER/ADMIN. `job` is null when none exists.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: narrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Latest job or null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LatestTtsJobResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/tts-jobs/{jobId}:
    get:
      operationId: getTtsJob
      summary: Poll a TTS generation job
      description: Roles EDITOR/REVIEWER/ADMIN.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current job state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TtsGenerationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown job (or removed by the retention policy)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
  /v1/admin/tts-jobs/{jobId}/cancel:
    post:
      operationId: cancelTtsJob
      summary: Request cancellation of a queued or running job
      description: >-
        Roles EDITOR/ADMIN. Conditional: only a queued/running job becomes
        cancelled (a running job's result is then discarded by the worker); a
        terminal job is returned unchanged.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Job after cancellation request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TtsGenerationJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/narrations/{id}/audio/playback:
    get:
      operationId: getAdminNarrationAudioPlayback
      summary: Ten-minute signed URL to preview a narration's current audio (v1.1)
      description: >-
        Roles EDITOR/REVIEWER/ADMIN. Works for any workflow status, so editors
        and reviewers can listen to draft (e.g. AI-generated) audio before
        publish.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Signed playback URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NarrationAudioPlayback' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown narration, or NARRATION_AUDIO_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
        '503':
          description: MEDIA_STORAGE_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
  /v1/routes:
    post:
      operationId: createRoute
      summary: Route from the visitor position to a published POI's primary entrance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteRequest' }
      responses:
        '201':
          description: Pedestrian route snapped to the internal walkway graph
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Published POI or active primary entrance was not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
        '422':
          description: Origin is outside the routable area or no eligible route exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
  /v1/events/batch:
    post:
      operationId: ingestAnalyticsBatch
      summary: Ingest a consented, privacy-safe analytics batch
      description: >-
        Authentication is optional. Without a bearer token, anonymousSessionId is
        required. Exact location, GPS trails, route geometry and direct PII are rejected.
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticsBatchRequest' }
      responses:
        '201':
          description: Batch processed; duplicate IDs were not inserted again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsBatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Query validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    Unauthorized:
      description: Missing or invalid credential
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    Forbidden:
      description: Authenticated user lacks the required role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    TtsQuotaExceeded:
      description: >-
        AI08 quota. code rate_limited (per-user window) or concurrency_limited
        (queued+running backlog full); details.retryAfterSeconds is a hint.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
  schemas:
    UserRole:
      type: string
      enum: [VISITOR, EDITOR, REVIEWER, ADMIN]
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10, writeOnly: true }
        preferredLocale: { $ref: '#/components/schemas/SupportedLocale' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, writeOnly: true }
    AuthResponse:
      type: object
      required: [user, accessToken, refreshToken, accessTokenExpiresIn]
      properties:
        user:
          type: object
          required: [id, email, preferredLocale, roles]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            preferredLocale: { $ref: '#/components/schemas/SupportedLocale' }
            roles:
              { type: array, items: { $ref: '#/components/schemas/UserRole' } }
        accessToken: { type: string, writeOnly: true }
        refreshToken: { type: string, writeOnly: true }
        accessTokenExpiresIn: { type: integer }
    AdminPoiInput:
      type: object
      required:
        [slug, category, location, translations, entrances, operatingHours]
      properties:
        slug: { type: string }
        category: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
        translations: { type: array, items: { type: object } }
        entrances: { type: array, items: { type: object } }
        operatingHours:
          {
            type: array,
            items: { $ref: '#/components/schemas/PoiOperatingHours' },
          }
    AdminPoi:
      allOf:
        - { $ref: '#/components/schemas/AdminPoiInput' }
        - type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status:
              {
                type: string,
                enum: [draft, pending_review, published, rejected],
              }
            pendingVersionId: { type: string, format: uuid }
            rejectionReason: { type: string }
    WorkflowReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
    AuditLogEntry:
      type: object
      required:
        [id, actorId, action, entityType, entityId, before, after, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        action: { type: string }
        entityType: { type: string, enum: [poi] }
        entityId: { type: string, format: uuid }
        before: { nullable: true }
        after: { nullable: true }
        createdAt: { type: string, format: date-time }
    SupportedLocale:
      type: string
      enum: [vi, en]
      default: vi
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number }
        longitude: { type: number }
    RouteRequest:
      type: object
      required: [from, poiId]
      properties:
        from:
          type: object
          required: [lat, lng]
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
        poiId: { type: string, format: uuid }
        accessible: { type: boolean, default: false }
    GeoJsonLineString:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [LineString] }
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
    RouteStep:
      type: object
      required: [sequence, instruction, distanceMeters]
      properties:
        sequence: { type: integer, minimum: 1 }
        instruction: { type: string }
        distanceMeters: { type: number, minimum: 0 }
    RouteResponse:
      type: object
      required: [routeId, version, geometry, distanceMeters, etaSeconds, steps]
      properties:
        routeId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        geometry: { $ref: '#/components/schemas/GeoJsonLineString' }
        distanceMeters: { type: number, minimum: 0 }
        etaSeconds: { type: integer, minimum: 0 }
        steps:
          type: array
          items: { $ref: '#/components/schemas/RouteStep' }
    NarrationAudioInput:
      type: object
      required:
        [
          objectKey,
          mimeType,
          sizeBytes,
          sha256,
          durationSeconds,
          rightsOwner,
          rightsSource,
          usageRights,
        ]
      properties:
        objectKey:
          type: string
          description: Immutable private object key; never returned by the public API
        mimeType:
          type: string
          enum: [audio/mpeg, audio/mp4, audio/ogg, audio/wav]
        sizeBytes: { type: integer, minimum: 1, maximum: 52428800 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        durationSeconds: { type: number, exclusiveMinimum: 0, maximum: 1800 }
        rightsOwner: { type: string }
        rightsSource: { type: string }
        usageRights: { type: string }
    MediaUploadIntentRequest:
      type: object
      required: [poiId, locale, mimeType, sizeBytes, sha256]
      properties:
        poiId: { type: string, format: uuid }
        locale: { $ref: '#/components/schemas/NarrationLocaleCode' }
        mimeType:
          type: string
          enum: [audio/mpeg, audio/mp4, audio/ogg, audio/wav]
        sizeBytes: { type: integer, minimum: 1, maximum: 52428800 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    MediaUploadIntent:
      type: object
      required: [objectKey, uploadUrl, method, expiresAt, requiredHeaders]
      properties:
        objectKey: { type: string }
        uploadUrl: { type: string, format: uri }
        method: { type: string, enum: [PUT] }
        expiresAt: { type: string, format: date-time }
        requiredHeaders:
          type: object
          required:
            [
              content-type,
              content-length,
              x-amz-checksum-sha256,
              x-amz-meta-sha256,
            ]
          properties:
            content-type: { type: string }
            content-length: { type: string }
            x-amz-checksum-sha256: { type: string }
            x-amz-meta-sha256: { type: string }
    NarrationInput:
      type: object
      required: [locale, transcript]
      properties:
        locale: { $ref: '#/components/schemas/NarrationLocaleCode' }
        transcript: { type: string, minLength: 20, maxLength: 20000 }
        audio:
          allOf: [{ $ref: '#/components/schemas/NarrationAudioInput' }]
          nullable: true
    NarrationUpdate:
      type: object
      properties:
        transcript: { type: string, minLength: 20, maxLength: 20000 }
        audio:
          allOf: [{ $ref: '#/components/schemas/NarrationAudioInput' }]
          nullable: true
    NarrationLocaleCode:
      type: string
      maxLength: 35
      description: BCP 47 narration locale code (dynamic; not limited to vi/en)
      example: vi
    NarrationLocaleOption:
      type: object
      required: [code, nativeLabel, speechTag]
      properties:
        code: { type: string, description: BCP 47 locale code }
        nativeLabel: { type: string }
        speechTag:
          { type: string, description: Web Speech / speechSynthesis tag }
        fallbackLocale: { type: string }
    NarrationLocaleCatalog:
      type: object
      required: [defaultLocale, locales]
      properties:
        defaultLocale: { type: string }
        locales:
          type: array
          items: { $ref: '#/components/schemas/NarrationLocaleOption' }
    TtsJobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    CreateTtsJobRequest:
      type: object
      required: [locale]
      properties:
        locale: { type: string, description: Must be an enabled catalog locale }
        provider: { type: string }
        model: { type: string }
    TtsGenerationJob:
      type: object
      required:
        [
          id,
          narrationId,
          status,
          provider,
          model,
          modelVersion,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        narrationId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TtsJobStatus' }
        provider: { type: string }
        model: { type: string }
        modelVersion: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        errorCode:
          type: string
          description: >-
            Stable error code only, present only when status is failed:
            TTS_PROVIDER_ERROR, TTS_TIMEOUT, TTS_AUDIO_INVALID,
            TTS_STORAGE_ERROR, TTS_MODEL_UNAVAILABLE, TTS_NARRATION_NOT_DRAFT,
            TTS_TRANSCRIPT_STALE, TTS_WORKER_LOST (re-claimed after a worker
            stopped with every attempt spent). Consumers must tolerate new
            codes.
        artifact:
          allOf: [{ $ref: '#/components/schemas/TtsJobArtifactSummary' }]
          description: v1.1 — present only when status is succeeded
    TtsJobArtifactSummary:
      type: object
      required:
        [
          voiceId,
          license,
          audioSha256,
          sizeBytes,
          durationSeconds,
          sampleRateHz,
          mimeType,
        ]
      properties:
        voiceId: { type: string }
        license: { type: string }
        audioSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        sizeBytes: { type: integer, minimum: 1 }
        durationSeconds: { type: number }
        sampleRateHz: { type: integer }
        mimeType: { type: string, enum: [audio/wav] }
    LatestTtsJobResponse:
      type: object
      required: [job]
      properties:
        job:
          allOf: [{ $ref: '#/components/schemas/TtsGenerationJob' }]
          nullable: true
    NarrationAudioGeneratedBy:
      type: object
      readOnly: true
      required:
        [provider, model, modelVersion, voiceId, license, jobId, generatedAt]
      properties:
        provider: { type: string }
        model: { type: string }
        modelVersion: { type: string }
        voiceId: { type: string }
        license: { type: string }
        jobId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
    NarrationAudioPlayback:
      type: object
      required: [playbackUrl, playbackExpiresAt]
      properties:
        playbackUrl: { type: string, format: uri }
        playbackExpiresAt: { type: string, format: date-time }
    AdminNarration:
      allOf:
        - { $ref: '#/components/schemas/NarrationInput' }
        - type: object
          required: [id, poiId, revision, status, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            poiId: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
            status:
              type: string
              enum: [draft, pending_review, published, rejected, superseded]
            rejectionReason: { type: string }
            audioGeneratedBy:
              allOf:
                [{ $ref: '#/components/schemas/NarrationAudioGeneratedBy' }]
              description: >-
                v1.1, response-only — AI provenance when the current audio was
                generated by a TTS job; absent for editor-uploaded audio
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    PublicNarrationAudio:
      type: object
      required:
        [
          mimeType,
          sizeBytes,
          sha256,
          durationSeconds,
          rightsOwner,
          rightsSource,
          usageRights,
          playbackUrl,
          playbackExpiresAt,
        ]
      properties:
        mimeType:
          type: string
          enum: [audio/mpeg, audio/mp4, audio/ogg, audio/wav]
        sizeBytes: { type: integer, minimum: 1 }
        sha256: { type: string }
        durationSeconds: { type: number }
        rightsOwner: { type: string }
        rightsSource: { type: string }
        usageRights: { type: string }
        playbackUrl:
          type: string
          format: uri
          description: Ten-minute signed GET URL for reviewed published audio
        playbackExpiresAt: { type: string, format: date-time }
    PoiNarration:
      type: object
      required:
        [
          id,
          poiId,
          requestedLocale,
          resolvedLocale,
          fallbackUsed,
          transcript,
          audio,
        ]
      properties:
        id: { type: string, format: uuid }
        poiId: { type: string, format: uuid }
        requestedLocale: { $ref: '#/components/schemas/NarrationLocaleCode' }
        resolvedLocale: { $ref: '#/components/schemas/NarrationLocaleCode' }
        fallbackUsed: { type: boolean }
        transcript: { type: string }
        audio:
          allOf: [{ $ref: '#/components/schemas/PublicNarrationAudio' }]
          nullable: true
    PoiSummary:
      type: object
      required:
        [
          id,
          slug,
          category,
          location,
          requestedLocale,
          resolvedLocale,
          fallbackUsed,
          name,
          shortDescription,
          isOpen,
        ]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        category: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
        requestedLocale: { $ref: '#/components/schemas/SupportedLocale' }
        resolvedLocale: { $ref: '#/components/schemas/SupportedLocale' }
        fallbackUsed: { type: boolean }
        name: { type: string }
        shortDescription: { type: string }
        distanceMeters: { type: integer, minimum: 0 }
        isOpen: { type: boolean }
    SearchReason:
      type: string
      enum:
        [
          exact_name,
          accent_insensitive_name,
          text_match,
          nearby,
          open_now,
          semantic,
        ]
    SearchResult:
      allOf:
        - { $ref: '#/components/schemas/PoiSummary' }
        - type: object
          required: [score, reasons]
          properties:
            score: { type: number, minimum: 0 }
            reasons:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/SearchReason' }
    SearchResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 50 }
        offset: { type: integer, minimum: 0 }
        nextOffset: { type: integer, minimum: 0 }
    PoiEntrance:
      type: object
      required: [id, label, location, graphNodeRef, isPrimary, accessibility]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
        graphNodeRef: { type: string }
        isPrimary: { type: boolean }
        accessibility: { type: string, enum: [standard, step_free] }
    PoiOperatingHours:
      type: object
      required: [dayOfWeek, opensAt, closesAt]
      properties:
        dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
        opensAt: { type: string }
        closesAt: { type: string }
    PoiDetail:
      allOf:
        - { $ref: '#/components/schemas/PoiSummary' }
        - type: object
          required: [longDescription, entrances, operatingHours]
          properties:
            longDescription: { type: string }
            entrances:
              type: array
              items: { $ref: '#/components/schemas/PoiEntrance' }
            operatingHours:
              type: array
              items: { $ref: '#/components/schemas/PoiOperatingHours' }
    PoiListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PoiSummary' }
        total: { type: integer, minimum: 0 }
    AnalyticsEventType:
      type: string
      enum:
        [
          app_opened,
          poi_viewed,
          narration_started,
          narration_completed,
          route_requested,
          route_started,
          route_completed,
        ]
    AnalyticsEventPayload:
      type: object
      description: >-
        Event-specific coarse context only. Unknown fields and any GPS/PII-like
        fields are rejected by the endpoint.
      additionalProperties: false
      properties:
        poiId: { type: string, format: uuid }
        locale: { $ref: '#/components/schemas/SupportedLocale' }
        accessible: { type: boolean }
    AnalyticsEventInput:
      type: object
      additionalProperties: false
      required: [eventId, schemaVersion, eventType, occurredAt, payload]
      properties:
        eventId:
          type: string
          format: uuid
          description: Client-generated UUID v4 idempotency key
        schemaVersion: { type: integer, enum: [1] }
        eventType: { $ref: '#/components/schemas/AnalyticsEventType' }
        occurredAt: { type: string, format: date-time }
        payload: { $ref: '#/components/schemas/AnalyticsEventPayload' }
    AnalyticsBatchRequest:
      type: object
      additionalProperties: false
      required: [consent, events]
      properties:
        anonymousSessionId:
          type: string
          format: uuid
          description: Required when bearer authentication is absent
        consent:
          type: object
          additionalProperties: false
          required: [analytics, policyVersion]
          properties:
            analytics: { type: boolean, enum: [true] }
            policyVersion: { type: string, minLength: 1, maxLength: 40 }
        events:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/AnalyticsEventInput' }
    AnalyticsBatchResponse:
      type: object
      required: [acceptedEventIds, duplicateEventIds]
      properties:
        acceptedEventIds:
          type: array
          items: { type: string, format: uuid }
        duplicateEventIds:
          type: array
          items: { type: string, format: uuid }
    ApiErrorEnvelope:
      type: object
      required: [code, message, details, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        details: { nullable: true }
        requestId: { type: string }
