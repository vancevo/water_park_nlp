name: damsen-smart-guide

services:
  postgres:
    platform: linux/amd64
    build:
      context: ./postgres
    image: damsen/postgres-spatial:16
    environment:
      POSTGRES_DB: damsen
      POSTGRES_USER: damsen
      POSTGRES_PASSWORD: damsen_local_only
    ports:
      - "64321:5432"
    volumes:
      - damsen_postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U damsen -d damsen"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - damsen_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-storage:
    # quay.io/minio/minio and minio/minio were withdrawn upstream (401/denied);
    # this is the last Bitnami archive build of the MinIO server, pinned by digest.
    # Server-wide CORS stands in for bucket CORS (MinIO does not implement it).
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    environment:
      MINIO_ROOT_USER: damsen_local
      MINIO_ROOT_PASSWORD: damsen_local_password
      MINIO_DEFAULT_BUCKETS: damsen-media
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3001,http://localhost:3002
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - damsen_object_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  damsen_postgres_data:
  damsen_redis_data:
  damsen_object_data:
